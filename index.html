<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bilkodi ile Eşini Bul</title>
<style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#273266}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#fff9ae,transparent 25%),radial-gradient(circle at 85% 90%,#b8f7e8,transparent 30%),#eef0ff}button{font:inherit;cursor:pointer;touch-action:manipulation}header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2vw;background:#ffffffc9;box-shadow:0 5px 25px #4b5ca91a}h1{font-size:clamp(1.25rem,2.4vw,2.3rem);margin:0;color:#6541ad}header p{margin:2px 0 0;font-size:clamp(.8rem,1.2vw,1rem)}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill,.action{border:0;border-radius:100px;padding:11px 18px;background:#fff;box-shadow:0 4px 12px #41439322;font-weight:800}.action{background:#7253da;color:#fff}.shell{max-width:1320px;margin:auto;padding:12px 2vw 24px}.status{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 12px;font-weight:800}.progress{height:12px;border-radius:20px;background:#dcd9f6;overflow:hidden;flex:1;max-width:280px}.progress>span{display:block;background:#25cba9;height:100%;width:0;transition:width .3s}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(6px,1vw,13px);width:min(100%,1050px,calc((100dvh - 170px)*1.28));margin:auto}.card{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:18px;background:#fff;box-shadow:0 5px 0 #b7b7dd,0 8px 16px #575aa52a;overflow:hidden;transition:transform .2s,box-shadow .2s}.card:hover:not(:disabled){transform:translateY(-2px)}.card:focus-visible{outline:5px solid #ffb828;outline-offset:2px}.card .back,.card .front{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .2s}.back{background:linear-gradient(145deg,#7552dc,#b068e9);color:white;font-size:clamp(2.3rem,6vw,5rem);font-weight:900}.back:before{content:'';position:absolute;inset:9px;border:2px dashed #ffffff80;border-radius:12px}.front{opacity:0;background:white}.front img{width:100%;height:100%;object-fit:cover}.card-label{position:absolute;bottom:0;left:0;right:0;background:#fffffff0;color:#38326f;font-size:clamp(.65rem,1.25vw,1rem);font-weight:900;padding:4px 2px;text-align:center}.card.open .back,.card.matched .back{opacity:0}.card.open .front,.card.matched .front{opacity:1}.card.matched{box-shadow:0 0 0 4px #30d7a3,0 6px 16px #28b98166}.card.gone{visibility:hidden;pointer-events:none;opacity:0;transform:scale(.2);transition:opacity .45s,transform .45s,visibility .45s}.intro{background:#25204f;color:#fff;overflow:hidden;position:relative}.intro:before,.intro:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#6e38bb 0%,#b04bcb 25%,transparent 50%,#b04bcb 75%,#6e38bb 100%);pointer-events:none;animation:curtains 1.5s ease-out both}.intro:after{background:radial-gradient(circle at 50% 38%,#ffd87275,transparent 45%);animation:spotlight 3.2s ease-in-out infinite alternate}.intro .panel{position:relative;z-index:1;background:transparent;color:#fff;box-shadow:none;width:min(800px,100%)}.intro .panel h2{font-size:clamp(2rem,5vw,4rem);text-shadow:0 4px 18px #0008}.intro .panel p{color:#fff}.film{display:flex;justify-content:center;gap:12px;align-items:center;margin:10px auto 20px}.film img{width:min(24vw,150px);height:min(24vw,150px);object-fit:cover;border:5px solid #fff;border-radius:20px;box-shadow:0 10px 25px #0007;animation:filmIn .8s both}.film img:nth-child(2){animation-delay:.3s;transform:scale(1.1)}.film img:nth-child(3){animation-delay:.6s}.intro .action{background:#ffcf46;color:#392b76;box-shadow:0 6px 0 #db8d24}.intro .small{color:#e9dcff}@keyframes curtains{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 49% 0 49%)}}@keyframes spotlight{from{opacity:.3}to{opacity:1}}@keyframes filmIn{from{opacity:0;translate:0 40px;rotate:-8deg}to{opacity:1;translate:0 0;rotate:0deg}}.overlay{position:fixed;inset:0;background:#34316b96;display:grid;place-items:center;padding:20px;z-index:3}.overlay[hidden]{display:none}.panel{width:min(520px,100%);background:#fff;border-radius:28px;padding:28px;text-align:center;box-shadow:0 24px 80px #25226155}.panel h2{font-size:clamp(1.7rem,4vw,2.6rem);margin:8px}.panel p{font-size:1.15rem;line-height:1.5}.panel img{height:120px;max-width:100%;object-fit:contain}.panel .action{font-size:1.25rem;padding:15px 30px}.small{font-size:.9rem;color:#666}#message{min-height:1.4em;text-align:center;margin:12px 0;font-weight:800;color:#6643a5}@media(max-width:700px){header{align-items:flex-start;flex-direction:column}.board{grid-template-columns:repeat(4,1fr)}.card{aspect-ratio:1}.shell{padding:10px}.status{font-size:.85rem}.pill,.action{padding:9px 12px}}@media(max-height:760px) and (min-width:701px){header{padding:6px 2vw}.shell{padding:6px 2vw}.board{width:min(100%,calc((100dvh - 145px)*1.22))}.card{aspect-ratio:1}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style></head><body>
<header><div><h1>🌟 Bilkodi ile Eşini Bul!</h1><p>Aynı etkinliği yapan Bilkodi kartlarını eşleştir.</p></div><div class="top"><span class="pill" id="score">Eşler: 0 / 10</span><span class="pill" id="tries">Deneme: 0</span><button class="action" id="restart">Yeniden Başla</button><button class="pill" id="fullscreen">⛶ Tam Ekran</button></div></header>
<main class="shell"><div class="status"><span>20 kart • 10 eş</span><div class="progress" aria-label="Tamamlanan eşler"><span id="progress"></span></div><span id="timer">Süre: 00:00</span></div><div class="board" id="board" aria-label="Eş bulma kartları"></div><p id="message" aria-live="polite"></p></main>
<div class="overlay intro" id="overlay"><div class="panel"><div class="film" aria-hidden="true"><img src="gorseller/dans.jpg" alt=""><img src="gorseller/bilkod.jpg" alt=""><img src="gorseller/resim.jpg" alt=""></div><h2 id="modal-title">Bilkodi'nin Anaokulu Macerası</h2><p id="modal-text">Kartları aç, aynı resimleri bul! Her oyunda 20 kart ve 10 eş var.</p><button class="action" id="start">Etkinliğe Başla</button><p class="small">Akıllı tahta, dokunmatik ekran, tablet ve bilgisayarda oynanır.</p></div></div>
<script>
const scenes=[['beden-egitimi','Beden eğitimi'],['muzik','Müzik'],['bilkod','Bilkod'],['satranc','Satranç'],['kahvalti','Kahvaltı'],['ogle-yemegi','Öğle yemeği'],['resim','Resim'],['kitap','Kitap'],['puzzle','Puzzle'],['lego','LEGO'],['dans','Dans']];
const board=document.querySelector('#board'),overlay=document.querySelector('#overlay');let first=null,lock=false,pairs=0,attempts=0,elapsed=0,ticker=null,delay=null,gameId=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function time(){document.querySelector('#timer').textContent='Süre: '+String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0')}
let audioCtx=null;
function tone(freq,at,length,shape='sine',volume=.13){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=shape;o.frequency.setValueAtTime(freq,at);g.gain.setValueAtTime(.001,at);g.gain.exponentialRampToValueAtTime(volume,at+.025);g.gain.exponentialRampToValueAtTime(.001,at+length);o.connect(g).connect(audioCtx.destination);o.start(at);o.stop(at+length+.02)}
function sound(which){try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const t=audioCtx.currentTime+.02;if(which==='tap'){tone(440,t,.08,'sine',.055)}else if(which==='match'){tone(523,t,.17);tone(659,t+.13,.17);tone(784,t+.26,.29)}else{tone(880,t,.12,'sine',.09);tone(1175,t+.11,.2,'sine',.09)}}catch(e){/* Audio is optional on unsupported browsers. */}}
function setup(){gameId++;clearInterval(ticker);clearTimeout(delay);first=null;lock=false;pairs=attempts=elapsed=0;time();document.querySelector('#score').textContent='Eşler: 0 / 10';document.querySelector('#tries').textContent='Deneme: 0';document.querySelector('#progress').style.width='0';document.querySelector('#message').textContent='';board.replaceChildren();const chosen=shuffle([...scenes]).slice(0,10);const cards=shuffle([...chosen,...chosen].map(([id,label])=>({id,label})));for(const {id,label} of cards){const b=document.createElement('button');b.className='card';b.type='button';b.dataset.id=id;b.setAttribute('aria-label','Kapalı kart');b.innerHTML='<span class="back" aria-hidden="true">?</span><span class="front"><img alt="" loading="eager"><span class="card-label"></span></span>';b.querySelector('.card-label').textContent=label;b.querySelector('img').src='gorseller/'+id+'.jpg';b.addEventListener('click',()=>flip(b,label));board.append(b)}ticker=setInterval(()=>{elapsed++;time()},1000)}
function flip(b,label){if(lock||b.classList.contains('open')||b.classList.contains('matched'))return;sound('tap');b.classList.add('open');b.setAttribute('aria-label',label);if(!first){first=b;return}attempts++;document.querySelector('#tries').textContent='Deneme: '+attempts;const prev=first;first=null;if(prev.dataset.id===b.dataset.id){prev.classList.add('matched');b.classList.add('matched');prev.disabled=b.disabled=true;sound('match');const matchedGame=gameId;setTimeout(()=>{if(matchedGame!==gameId)return;prev.classList.add('gone');b.classList.add('gone');prev.setAttribute('aria-label','Eşleşti ve kaldırıldı');b.setAttribute('aria-label','Eşleşti ve kaldırıldı');sound('vanish')},720);pairs++;document.querySelector('#score').textContent='Eşler: '+pairs+' / 10';document.querySelector('#progress').style.width=(pairs*10)+'%';document.querySelector('#message').textContent='Harika! Bir eş buldun! 🎉';if(pairs===10){clearInterval(ticker);delay=setTimeout(()=>{document.querySelector('#modal-title').textContent='Bravo, tüm eşleri buldun! 🎉';document.querySelector('#modal-text').textContent=`${attempts} denemede ve ${Math.floor(elapsed/60)} dakika ${elapsed%60} saniyede tamamladın.`;document.querySelector('#start').textContent='Tekrar Oyna';overlay.classList.remove('intro');overlay.hidden=false},1450)}}else{lock=true;document.querySelector('#message').textContent='Bir daha dene!';const current=gameId;delay=setTimeout(()=>{if(current!==gameId)return;prev.classList.remove('open');b.classList.remove('open');prev.setAttribute('aria-label','Kapalı kart');b.setAttribute('aria-label','Kapalı kart');lock=false},1100)}}
document.querySelector('#start').onclick=()=>{overlay.hidden=true;overlay.classList.remove('intro');setup()};document.querySelector('#restart').onclick=()=>{overlay.hidden=true;setup()};document.querySelector('#fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
</script></body></html>
